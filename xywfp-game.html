<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xywfp - King of the Riders Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f0c29;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            color: white;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            border: 3px solid #667eea;
            border-radius: 10px;
            overflow: hidden;
        }

        #player {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #ff6b6b;
            border-radius: 50%;
            bottom: 50px;
            left: 50px;
            transition: bottom 0.2s;
        }

        .obstacle {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #f00;
            border-radius: 5px;
            right: -30px;
            top: 320px;
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #start-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <h1>.xywfp Adventure</h1>
        <p>“I’m gonna be the King of the Riders!”</p>
        <button id="start-btn">Start Game</button>
    </div>
    <div id="player"></div>
    <div id="score">Score: 0</div>
</div>

<script>
    const player = document.getElementById("player");
    const gameContainer = document.getElementById("game-container");
    const scoreDisplay = document.getElementById("score");
    const startScreen = document.getElementById("start-screen");
    const startBtn = document.getElementById("start-btn");

    let isJumping = false;
    let isGameOver = false;
    let score = 0;
    let gameSpeed = 5;

    function jump() {
        if (isJumping) return;
        isJumping = true;
        let upCount = 0;
        let downCount = 0;

        const jumpInterval = setInterval(() => {
            if (upCount < 15) {
                player.style.bottom = (parseInt(player.style.bottom) + 10) + "px";
                upCount++;
            } else if (downCount < 15) {
                player.style.bottom = (parseInt(player.style.bottom) - 10) + "px";
                downCount++;
            } else {
                clearInterval(jumpInterval);
                isJumping = false;
            }
        }, 20);
    }

    function createObstacle() {
        if (isGameOver) return;

        const obstacle = document.createElement("div");
        obstacle.classList.add("obstacle");
        gameContainer.appendChild(obstacle);

        let obstaclePos = 800;
        const moveObstacle = setInterval(() => {
            if (obstaclePos < -30) {
                clearInterval(moveObstacle);
                obstacle.remove();
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
            } else if (
                obstaclePos > 40 && obstaclePos < 90 &&
                parseInt(player.style.bottom) < 70
            ) {
                clearInterval(moveObstacle);
                isGameOver = true;
                alert(`Game Over! Skor kamu: ${score}`);
                location.reload();
            } else {
                obstacle.style.right = (800 - obstaclePos) + "px";
                obstaclePos -= gameSpeed;
            }
        }, 20);
    }

    function startGame() {
        startScreen.style.display = "none";
        setInterval(createObstacle, 2000);
    }

    startBtn.addEventListener("click", startGame);

    document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
            jump();
        }
    });
</script>

</body>
</html>
